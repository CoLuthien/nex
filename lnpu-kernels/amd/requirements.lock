# Pinned so a rebuild months from now produces the same xclbins. The mlir-aie and llvm-aie
# wheels are not on PyPI -- they are GitHub release assets, and the nightly index they come
# from does not keep old builds forever. If one of these disappears, mirror it rather than
# floating the pin: a different compiler makes different instruction streams, and every
# reference this repository checks against was produced by these.
--index-url https://download.pytorch.org/whl/cpu
--find-links https://github.com/Xilinx/mlir-aie/releases/expanded_assets/latest-wheels-4
--find-links https://github.com/Xilinx/llvm-aie/releases/expanded_assets/nightly
--extra-index-url https://pypi.org/simple

